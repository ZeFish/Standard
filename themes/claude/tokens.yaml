meta:
  id: claude
  label: Claude
  selector: "[data-theme=\"claude\"]"
  fonts:
    - "@stnd/fonts/monolisa"
tokens:
  color-light-background: oklch(0.982 0.006 85)
  color-light-foreground: oklch(0.25 0.015 60)
  color-light-accent: oklch(0.62 0.14 39.04)
  color-dark-foreground: oklch(0.90 0.005 60)
  color-dark-background: oklch(0.252 0.002 60)
  color-dark-accent: oklch(0.65 0.13 38.76)
  color-dark-stage: oklch(0.178 0 0)
  color-code: var(--color-foreground)
  color-light-bold: var(--color-light-accent)
  color-light-italic: color-mix( in srgb, var(--color-accent) 65%, var(--color-foreground) )
  font-serif: "\"Ibarra Real Nova\", Georgia, \"Times New Roman\", serif"
  font-monospace: "\"MonoLisa\", ui-monospace, SFMono-Regular, Menlo, Monaco, \"Roboto Mono\", monospace"
  optical-ratio: "1.414"
  color-light-border: color-mix(in srgb, var(--color-foreground) 6%, transparent)
  font-size: 1.0625rem
  font-ratio: "1.25"
  font-density: "1.5"
  font-line-width: 42rem
