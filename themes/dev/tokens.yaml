meta:
  id: dev
  label: Dev
  selector: '[data-theme="dev"]'
  fonts:
    - "@stnd/fonts/inter"
    - "@stnd/fonts/berkeley-mono"
    - "@stnd/fonts/monolisa"
tokens:
  color-light-background: "#fff"
  color-light-foreground: "#000"
  color-dark-background: "#1c1c1b"
  color-dark-foreground: "#dbcd93"
  color-dark-red: "#971d1d"
  color-dark-orange: "#c48745"
  color-dark-yellow: "#c7a540"
  color-dark-green: "#919300"
  color-dark-cyan: "#549b88"
  color-dark-blue: "#277d9e"
  color-dark-magenta: "#7a5ba8"
  color-accent: var(--color-dark-yellow)
  optical-ratio: "1.414"
  font-serif: '"Merriweather", Georgia, "Times New Roman", serif'
  font-sans: '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica
    Neue", Arial'
  font-monospace: '"Berkeley Mono", "MonoLisa", ui-monospace, SFMono-Regular,
    Menlo, Monaco, "Roboto Mono", monospace'
  border: 2px solid red
  color-shadow: green
