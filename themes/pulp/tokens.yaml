meta:
  id: pulp
  label: Pulp
  selector: |-
    :root[data-theme="pulp"],
    [data-theme="pulp"]
  fonts:
    - "@stnd/fonts/herbus"
    - "@stnd/fonts/century-expanded"
    - "@stnd/fonts/newsreader"
    - "@stnd/fonts/courier-prime"
tokens:
  color-light-background: oklch(0.94 0.032 85)
  color-light-foreground: oklch(0.20 0.02 55)
  color-light-accent: oklch(0.80 0.185 85)
  color-light-border: oklch(0.82 0.04 80)
  color-light-subtle: oklch(0.91 0.035 85)
  color-light-muted: oklch(0.48 0.025 60)
  color-light-yellow: oklch(0.80 0.185 85)
  color-light-red: oklch(0.55 0.22 28)
  color-light-orange: oklch(0.68 0.19 48)
  color-light-green: oklch(0.58 0.13 145)
  color-light-cyan: oklch(0.65 0.11 205)
  color-light-blue: oklch(0.50 0.13 250)
  color-light-purple: oklch(0.52 0.15 315)
  color-light-pink: oklch(0.62 0.18 15)
  color-dark-background: oklch(0.16 0.015 50)
  color-dark-foreground: oklch(0.88 0.03 85)
  color-dark-accent: oklch(0.84 0.19 85)
  color-dark-border: oklch(0.28 0.02 50)
  color-dark-subtle: oklch(0.22 0.018 50)
  color-dark-muted: oklch(0.60 0.025 70)
  color-dark-yellow: oklch(0.84 0.19 85)
  color-dark-red: oklch(0.65 0.24 28)
  color-dark-orange: oklch(0.74 0.20 50)
  color-dark-green: oklch(0.75 0.16 145)
  color-dark-cyan: oklch(0.75 0.13 205)
  color-dark-blue: oklch(0.68 0.16 250)
  color-dark-purple: oklch(0.70 0.19 315)
  color-dark-pink: oklch(0.72 0.20 15)
  color-light-bold: var(--color-red)
  color-light-italic: var(--color-orange)
  color-code: var(--color-red)
  font-text: "\"Century Expanded\", \"Newsreader\", Georgia, serif"
  font-header: "\"Herbus Apex\", \"Herbus\", serif"
  font-monospace: "\"Courier Prime\", monospace"
  font-interface: "\"Courier Prime\", monospace"
  font-header-letter-spacing: "-0.015em"
  font-header-line-height: "1.05"
  line-height: "1.55"
  radius: "0"
  radius-base: "0"
  radius-md: 2px
  radius-lg: 4px
  font-ratio: "1.25"
  font-density: "1.45"
  font-line-width: 39rem
