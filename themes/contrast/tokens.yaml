meta:
  id: contrast
  label: High Contrast
  selector: |-
    :root[data-theme="contrast"],
    [data-theme="contrast"]
  fonts:
    - "@stnd/fonts/atkinson-hyperlegible-next"
    - "@stnd/fonts/inter"
tokens:
  color-light-background: "#ffffff"
  color-light-foreground: "#000000"
  color-dark-background: "#000000"
  color-dark-foreground: "#ffffff"
  color-light-accent: "#0050ff"
  color-dark-accent: "#ffff00"
  color-light-border: var(--color-foreground)
  font-text: "\"Atkinson Hyperlegible Next\", \"Inter\", sans-serif"
  font-header: "\"Inter\", sans-serif"
  font-weight: "500"
  font-header-weight: "800"
  font-header-letter-spacing: 0.02em
  color-light-muted: var(--color-foreground)
  color-light-subtle: var(--color-foreground)
  font-ratio: "1.333"
  font-density: "1.45"
