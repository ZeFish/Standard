meta:
  id: avelo
  label: àVélo
  selector: "[data-theme=\"avelo\"]"
tokens:
  # Brand: Vélosolutions red (#d00008) is the accent in light, àVélo green
  # (#30d3ae) the accent in dark. Both read from the logos' own pixels.
  # The ground is darkened just enough (L 0.94) for the surface ladder to exist
  # in light: raised = +0.03 (0.97), overlay = +0.06 (1.00, white). On a white
  # ground the two top levels clamp to the same white.
  color-light-background: oklch(0.94 0.004 165)
  color-light-foreground: "#1d1f1e"
  color-light-accent: "#d00008"
  color-light-header: var(--color-light-foreground)
  color-light-red: "#b42318"
  color-light-orange: "#c2570c"
  color-light-yellow: "#a16207"
  color-light-green: "#16794a"
  color-light-cyan: "#0e7490"
  color-light-blue: "#1d5fa8"
  color-light-purple: "#6d4aa5"
  color-light-pink: "#b8326f"
  color-dark-background: "#121615"
  color-dark-foreground: "#e6ebe9"
  color-dark-accent: "#30d3ae"
  color-dark-header: var(--color-dark-foreground)
  color-dark-red: "#f0645a"
  color-dark-orange: "#f0954a"
  color-dark-yellow: "#e3b341"
  color-dark-green: "#4cc38a"
  color-dark-cyan: "#52c0d8"
  color-dark-blue: "#5b9cf0"
  color-dark-purple: "#a98be0"
  color-dark-pink: "#e873a8"
  radius: var(--space-d4)
  font-header: "\"Cal Sans\""
  font-text: "\"Cargo Diatype\""
  font-interface: "\"Cargo Diatype\""
  font-monospace: "\"MonoLisa\""
